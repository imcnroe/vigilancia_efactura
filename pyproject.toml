[project]
name = "regwatch"
version = "0.1.0"
description = "Vigilancia normativa de facturacion electronica (Espana y Francia)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "lxml>=5.2",
    "httpx>=0.27",
    "tenacity>=8.3",
    "boto3>=1.34",
    "typer>=0.12",
    "croniter>=2.0",
    "uuid7>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "types-croniter",
    "lxml-stubs",
]

[project.scripts]
regwatch = "regwatch.cli.main:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    # `PgUUID` es el alias habitual de sqlalchemy.dialects.postgresql.UUID y evita
    # colisionar con uuid.UUID, que se usa en las anotaciones de la misma linea.
    "N811",
    # Typer declara sus parametros con llamadas en los valores por defecto. Es su API
    # documentada, no un descuido.
    "B008",
    # `type_annotation_map` de la base declarativa de SQLAlchemy es un dict de clase
    # por diseno.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Los tests montan XSD con cadenas largas: partirlas los hace ilegibles.
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["regwatch"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requiere Postgres y MinIO en marcha",
]
